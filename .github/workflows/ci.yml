name: CI
on: 
  pull_request:
    branches:
      - main
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verificar versao do python
        run: python --version
        name: Verifica sintaxe do projeto
        run: python -m compileall .
        